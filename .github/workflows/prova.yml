# Every push and pull request must pass formatting, linting, and the contract.
name: proof

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/batuta

jobs:
  proof:
    name: fmt + clippy + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.93.1
          rustc --version && cargo --version

      - name: Check declared Rust 1.74 MSRV
        run: |
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
          cargo +1.74.0 check --locked

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/batuta/target
          key: proof-${{ runner.os }}-${{ hashFiles('crates/batuta/Cargo.lock') }}
          restore-keys: proof-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features -- --test-threads=1

  portal:
    name: portal tests + build + audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install locked dependencies
        working-directory: portal
        run: |
          test "$(npm --version)" = "11.13.0"
          npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: portal
        run: npm audit --audit-level=high

      - name: Test and typecheck
        working-directory: portal
        run: |
          ../script/test-installer.sh
          npm test
          npm run typecheck

      - name: Production build
        working-directory: portal
        run: npm run build

  sql:
    name: PostgreSQL migration + ingest invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply migrations twice and test ingest invariants
        working-directory: .
        run: ./script/test-sql.sh
