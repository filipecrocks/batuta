# Publica os binarios do Batuta quando uma tag v* e empurrada.
#
# Regra da casa: o binario tem zero dependencia, zero async, zero rede. Isso torna
# a compilacao cruzada facil — nao ha nenhuma lib C para achar.
#
# ESCOLHA PARA aarch64-unknown-linux-musl: gcc-aarch64-linux-gnu, NAO cross.
#   1. `cross` roda o build dentro de um container montando so a raiz do projeto
#      Cargo (aqui: crates/batuta). O main.rs faz
#      include_str!("../../../hooks/user-prompt-submit.sh") — arquivo que mora
#      FORA do crate. Dentro do container esse caminho nao existe e o build quebra.
#   2. Como nao existe codigo C no projeto, o gcc cruzado e usado apenas como
#      driver de link; a libc musl estatica vem do proprio rust-std (musl faz
#      crt-static e link self-contained por padrao). Resultado: binario estatico
#      de verdade, sem docker, sem toolchain de terceiro.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MANIFESTO: crates/batuta/Cargo.toml

jobs:
  compilar:
    name: compilar ${{ matrix.alvo }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - alvo: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - alvo: x86_64-apple-darwin
            runner: macos-13
          - alvo: aarch64-apple-darwin
            runner: macos-14
          - alvo: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust + alvo
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.alvo }}

      # musl-tools da o musl-gcc do x86_64; gcc-aarch64-linux-gnu da o linker do aarch64.
      - name: Linkers do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools gcc-aarch64-linux-gnu

      - name: Compilar release
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --manifest-path "$MANIFESTO" --target ${{ matrix.alvo }}

      - name: Empacotar (tar.gz + SHA256)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p entrega
          cp crates/batuta/target/${{ matrix.alvo }}/release/batuta entrega/batuta
          chmod 755 entrega/batuta
          nome="batuta-${{ matrix.alvo }}.tar.gz"
          tar -czf "$nome" -C entrega batuta
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$nome" > "$nome.sha256"
          else
            shasum -a 256 "$nome" > "$nome.sha256"
          fi
          cat "$nome.sha256"

      - name: Empacotar (zip + SHA256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path entrega | Out-Null
          Copy-Item "crates/batuta/target/${{ matrix.alvo }}/release/batuta.exe" entrega/batuta.exe
          $nome = "batuta-${{ matrix.alvo }}.zip"
          Compress-Archive -Path entrega/batuta.exe -DestinationPath $nome -Force
          $h = (Get-FileHash -Algorithm SHA256 $nome).Hash.ToLower()
          # Formato coreutils (dois espacos) para o `sha256sum -c` do job final aceitar.
          [IO.File]::WriteAllText((Join-Path $PWD "$nome.sha256"), "$h  $nome`n")
          Get-Content "$nome.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.alvo }}
          path: |
            batuta-${{ matrix.alvo }}.tar.gz*
            batuta-${{ matrix.alvo }}.zip*
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: publicar release
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: entrega
          merge-multiple: true

      - name: Consolidar SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd entrega
          ls -la
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Se um hash nao bater aqui, nao existe release.
          sha256sum -c SHA256SUMS

      - name: Criar o GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "batuta $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" entrega/* --repo "$GITHUB_REPOSITORY" --clobber
