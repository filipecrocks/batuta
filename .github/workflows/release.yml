# Build release binaries when a v* tag is pushed. Third-party actions and the
# Rust toolchain are immutable pins. Both Linux targets use Rust's self-contained
# musl linker and are checked for accidental dynamic linkage before packaging.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_MANIFEST_PATH: crates/batuta/Cargo.toml

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.93.1
          rustc --version && cargo --version

      - name: Verify Rust
        shell: bash
        run: |
          crate_version="$(cargo metadata --locked --no-deps --manifest-path "$CARGO_MANIFEST_PATH" | jq -r '.packages[] | select(.name == "batuta") | .version')"
          test "$GITHUB_REF_NAME" = "v$crate_version"
          cargo fmt --all --manifest-path "$CARGO_MANIFEST_PATH" -- --check
          cargo clippy --all-targets --locked --manifest-path "$CARGO_MANIFEST_PATH" -- -D warnings
          cargo test --locked --all-features --manifest-path "$CARGO_MANIFEST_PATH" -- --test-threads=1

      - name: Check declared Rust 1.74 MSRV
        shell: bash
        run: |
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
          cargo +1.74.0 check --locked --manifest-path "$CARGO_MANIFEST_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Verify package version matches the release tag
        shell: bash
        run: test "$(node -p "require('./npm/package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Verify portal and adapters
        working-directory: portal
        shell: bash
        run: |
          test "$(npm --version)" = "11.13.0"
          npm ci --ignore-scripts
          npm audit --audit-level=high
          ../script/test-installer.sh
          npm test
          npm run typecheck
          npm run build

      - name: Verify migrations and database invariants
        shell: bash
        run: ./script/test-sql.sh

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
          rustup target add ${{ matrix.target }}
          rustc --version --verbose

      - name: Build release
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --manifest-path "$CARGO_MANIFEST_PATH" --target ${{ matrix.target }}

      - name: Verify static Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          artifact="crates/batuta/target/${{ matrix.target }}/release/batuta"
          file "$artifact" | tee artifact-file.txt
          ! file "$artifact" | grep -Eqi 'dynamically linked|interpreter'

      - name: Package tar.gz and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp crates/batuta/target/${{ matrix.target }}/release/batuta release-files/batuta
          chmod 755 release-files/batuta
          package_name="batuta-${{ matrix.target }}.tar.gz"
          tar -czf "$package_name" -C release-files batuta
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package_name" > "$package_name.sha256"
          else
            shasum -a 256 "$package_name" > "$package_name.sha256"
          fi
          cat "$package_name.sha256"

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: batuta-${{ matrix.target }}.*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: |
            batuta-${{ matrix.target }}.tar.gz*
            batuta-${{ matrix.target }}.zip*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-files
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          ls -la
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'refusing to replace existing release %s\n' "$TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "batuta $TAG" \
            --generate-notes \
            --draft
          gh release upload "$TAG" release-files/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
