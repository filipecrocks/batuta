[package]
name = "batuta"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Open Agent Skills measurement layer: local routing and observation in milliseconds."
license = "MIT"
repository = "https://github.com/filipecrocks/batuta"
homepage = "https://batuta.space"

# Project rule: the hot-path binary has no dependencies, async runtime, or network.
# If it ever needs one of those, that code no longer belongs on the hot path.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "batuta"
path = "src/lib.rs"

[[bin]]
name = "batuta"
path = "src/main.rs"
